<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F2EEE4">
<title>五子棋 · 工坊游戏集</title>
<link rel="stylesheet" href="../assets/shell.css">
<style>
  .stage{padding:0 0 46px;}
  .board{
    position:relative;
    --cell:26px;
    width:calc(var(--cell) * 13);
    height:calc(var(--cell) * 13);
    background:linear-gradient(158deg,#F3EBD9 0%,#EADFC7 55%,#E4D8BE 100%);
    border:1px solid rgba(31,28,22,.30);
    border-radius:1px;
    box-shadow:
      var(--sh-deep),
      inset 0 0 0 1px rgba(255,255,255,.45),
      inset 0 0 34px rgba(31,28,22,.07);
    touch-action:manipulation;
  }
  /* 棋盘内框 */
  .board::before{
    content:"";position:absolute;inset:6px;pointer-events:none;z-index:0;
    border:1px solid rgba(31,28,22,.10);
  }
  .line{position:absolute;background:rgba(31,28,22,.28);pointer-events:none;z-index:1}
  .line.v{width:1px;top:calc(var(--cell) * .5);height:calc(var(--cell) * 12)}
  .line.h{height:1px;left:calc(var(--cell) * .5);width:calc(var(--cell) * 12)}
  .hoshi{
    position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(31,28,22,.55);
    transform:translate(-50%,-50%);pointer-events:none;z-index:2;
  }
  .stone{
    position:absolute;width:calc(var(--cell) * .86);height:calc(var(--cell) * .86);
    border-radius:50%;transform:translate(-50%,-50%);
    animation:drop .18s var(--ease);
    pointer-events:none;z-index:2;
  }
  /* 高光：一颗石榴籽似的反光 */
  .stone::before{
    content:"";position:absolute;left:24%;top:18%;width:28%;height:24%;border-radius:50%;
    background:rgba(255,255,255,.55);
  }
  @keyframes drop{
    from{transform:translate(-50%,-50%) scale(.55);opacity:.35}
    62%{transform:translate(-50%,-50%) scale(1.05);opacity:1}
    to{transform:translate(-50%,-50%) scale(1)}
  }
  .stone.b{
    background:radial-gradient(circle at 34% 26%,#57513F,#1A1711 72%);
    box-shadow:0 1px 2px rgba(31,28,22,.5), inset 0 -1px 2px rgba(0,0,0,.45);
  }
  .stone.w{
    background:radial-gradient(circle at 34% 26%,#FFFEFA,#E6DDC9 80%);
    box-shadow:0 1px 2px rgba(31,28,22,.30), inset 0 0 0 1px rgba(31,28,22,.18);
  }
  .stone.w::before{background:rgba(255,255,255,.95)}
  /* 最后一手：朱红小圈 */
  .stone.last::after{
    content:"";position:absolute;left:50%;top:50%;width:22%;height:22%;
    transform:translate(-50%,-50%);border-radius:50%;
    border:1px solid rgba(180,64,44,.9);
  }
  /* 连成五子：依次亮起，套一圈朱红 */
  .stone.win{z-index:4;animation:stoneWin .52s var(--ease) backwards}
  .stone.win::after{
    content:"";position:absolute;inset:-3px;border-radius:50%;
    border:1.5px solid rgba(180,64,44,.9);
    box-shadow:0 0 12px rgba(180,64,44,.45);
  }
  @keyframes stoneWin{
    0%{transform:translate(-50%,-50%) scale(1)}
    45%{transform:translate(-50%,-50%) scale(1.18)}
    100%{transform:translate(-50%,-50%) scale(1)}
  }
  /* 鼠标悬停时的虚位提示 */
  .ghost{
    position:absolute;width:calc(var(--cell) * .86);height:calc(var(--cell) * .86);
    border-radius:50%;transform:translate(-50%,-50%);
    border:1px dashed rgba(31,28,22,.38);background:rgba(31,28,22,.05);
    pointer-events:none;opacity:0;transition:opacity .16s;z-index:1;
  }
  .ghost.on{opacity:1}
  .mdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .mdot.b{background:radial-gradient(circle at 34% 26%,#57513F,#1A1711 72%)}
  .mdot.w{background:radial-gradient(circle at 34% 26%,#FFFEFA,#E6DDC9 80%);box-shadow:inset 0 0 0 1px rgba(31,28,22,.3)}
  .plinth b{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="bar__back" id="btnBack" aria-label="返回目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg>
    </button>
    <div class="bar__text">
      <div class="kicker">VIII · Gomoku</div>
      <h1>五子棋</h1>
    </div>
    <div class="bar__meta" id="uiTurn"></div>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board"></div>
    <div class="plinth">
      <span id="uiMeta">你执黑 · 13 路</span>
      <span class="r" id="uiRec">0 胜 0 负</span>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="segMode">
      <button data-m="ai">人机</button>
      <button data-m="duo">双人</button>
    </div>
    <span class="sep"></span>
    <button class="btn" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8H5V4"/><path d="M5.5 8.5A7 7 0 1 1 5 15"/></svg>
      悔棋
    </button>
    <button class="btn" id="btnRestart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      新局
    </button>
    <span class="sep"></span>
    <button class="btn btn--sq" id="btnSound" title="声音"></button>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function(){
  'use strict';
  const { Store, Sound, plate, toast, haptic } = Shell;

  const N = 13;
  const stage = document.getElementById('stage');
  const board = document.getElementById('board');
  const uiTurn = document.getElementById('uiTurn');
  const uiMeta = document.getElementById('uiMeta');
  const uiRec = document.getElementById('uiRec');
  const segMode = document.getElementById('segMode');
  const btnSound = document.getElementById('btnSound');

  const rec = Store.get('save.gomoku', {}) || {};
  rec.duo = rec.duo || { b: 0, w: 0 };

  const S = {
    grid: [],           // 0 空 1 黑 2 白
    turn: 1,
    stack: [],          // [r, c, v]
    over: false,
    busy: false,
    last: null,
    el: {},
    win: [],
    ghost: null,
    cell: 26,
    mode: rec.mode === 'duo' ? 'duo' : 'ai'
  };

  /* ---------------- 记录 ---------------- */
  function paintRec(){
    if(S.mode === 'duo'){
      uiRec.textContent = '黑 ' + (rec.duo.b || 0) + ' · 白 ' + (rec.duo.w || 0);
    }else{
      uiRec.textContent = (rec.win || 0) + ' 胜 ' + (rec.lose || 0) + ' 负';
    }
  }
  function paintSeg(){
    Array.prototype.forEach.call(segMode.children, b => {
      b.setAttribute('aria-pressed', String(b.dataset.m === S.mode));
    });
  }
  function updateTurn(){
    if(S.mode === 'duo'){
      uiTurn.innerHTML = '<i class="mdot ' + (S.turn === 1 ? 'b' : 'w') + '"></i>' +
        (S.turn === 1 ? '黑方落子' : '白方落子');
      uiMeta.textContent = '双人同屏 · 第 ' + S.stack.length + ' 手';
    }else{
      uiTurn.innerHTML = '<i class="mdot b"></i>' + (S.turn === 1 ? '轮到你了' : '它在下…');
      uiMeta.textContent = '你执黑 · 13 路';
    }
  }

  /* ---------------- 尺寸 ---------------- */
  function layout(){
    const availW = Math.min(stage.clientWidth, 560) - 2;
    const availH = stage.clientHeight - 46 - 8;
    const cell = Math.max(16, Math.floor(Math.min(availW / N, availH / N)));
    S.cell = cell;
    board.style.setProperty('--cell', cell + 'px');
    paintStones();
  }

  /* ---------------- 渲染 ---------------- */
  function init(){
    S.grid = [];
    for(let r = 0; r < N; r++) S.grid.push(new Array(N).fill(0));
    S.turn = 1;
    S.stack = [];
    S.over = false;
    S.busy = false;
    S.last = null;
    S.el = {};
    S.win = [];
    board.innerHTML = '';
    for(let k = 0; k < N; k++){
      const v = document.createElement('div');
      v.className = 'line v';
      v.style.left = 'calc(var(--cell) * ' + (k + .5) + ')';
      board.appendChild(v);
      const h = document.createElement('div');
      h.className = 'line h';
      h.style.top = 'calc(var(--cell) * ' + (k + .5) + ')';
      board.appendChild(h);
    }
    [[3, 3], [3, 9], [9, 3], [9, 9], [6, 6]].forEach(([r, c]) => {
      const d = document.createElement('div');
      d.className = 'hoshi';
      d.style.left = 'calc(var(--cell) * ' + (c + .5) + ')';
      d.style.top = 'calc(var(--cell) * ' + (r + .5) + ')';
      board.appendChild(d);
    });
    const gh = document.createElement('div');
    gh.className = 'ghost';
    board.appendChild(gh);
    S.ghost = gh;
    layout();
    paintSeg();
    paintRec();
    updateTurn();
  }

  function paintStones(){
    Array.prototype.slice.call(board.querySelectorAll('.stone')).forEach(n => n.remove());
    S.el = {};
    for(let r = 0; r < N; r++) for(let c = 0; c < N; c++){
      const v = S.grid[r] && S.grid[r][c];
      if(!v) continue;
      const d = document.createElement('div');
      d.className = 'stone ' + (v === 1 ? 'b' : 'w');
      d.style.left = ((c + .5) * S.cell) + 'px';
      d.style.top = ((r + .5) * S.cell) + 'px';
      if(S.last && S.last[0] === r && S.last[1] === c) d.classList.add('last');
      if(S.win && S.win.some(p => p[0] === r && p[1] === c)) d.classList.add('win');
      board.appendChild(d);
      S.el[r * N + c] = d;
    }
  }

  function addStone(r, c, v){
    S.grid[r][c] = v;
    const d = document.createElement('div');
    d.className = 'stone ' + (v === 1 ? 'b' : 'w');
    d.style.left = ((c + .5) * S.cell) + 'px';
    d.style.top = ((r + .5) * S.cell) + 'px';
    const prev = board.querySelector('.stone.last');
    if(prev) prev.classList.remove('last');
    d.classList.add('last');
    board.appendChild(d);
    S.el[r * N + c] = d;
    S.last = [r, c];
  }

  /* ---------------- 胜负 ---------------- */
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  function countIn(r, c, dr, dc, v){
    let n = 0, rr = r + dr, cc = c + dc;
    while(rr >= 0 && cc >= 0 && rr < N && cc < N && S.grid[rr][cc] === v){ n++; rr += dr; cc += dc; }
    return n;
  }
  function isFive(r, c, v){
    for(const [dr, dc] of DIRS){
      if(1 + countIn(r, c, dr, dc, v) + countIn(r, c, -dr, -dc, v) >= 5) return true;
    }
    return false;
  }
  /* 找出连成五子的那五颗（长连时取包含落子点的五个） */
  function winLine(r, c, v){
    for(const [dr, dc] of DIRS){
      const pts = [[r, c]];
      let rr = r - dr, cc = c - dc;
      while(rr >= 0 && cc >= 0 && rr < N && cc < N && S.grid[rr][cc] === v){ pts.unshift([rr, cc]); rr -= dr; cc -= dc; }
      rr = r + dr; cc = c + dc;
      while(rr >= 0 && cc >= 0 && rr < N && cc < N && S.grid[rr][cc] === v){ pts.push([rr, cc]); rr += dr; cc += dc; }
      if(pts.length >= 5){
        const i = pts.findIndex(p => p[0] === r && p[1] === c);
        const start = Math.max(0, Math.min(pts.length - 5, i - 2));
        return pts.slice(start, start + 5);
      }
    }
    return null;
  }
  function hasEmpty(){
    for(let r = 0; r < N; r++) for(let c = 0; c < N; c++) if(!S.grid[r][c]) return true;
    return false;
  }

  /* ---------------- AI ---------------- */
  function runScore(r, c, pl, dr, dc){
    let n = 1, open = 0;
    let rr = r + dr, cc = c + dc;
    while(rr >= 0 && cc >= 0 && rr < N && cc < N && S.grid[rr][cc] === pl){ n++; rr += dr; cc += dc; }
    if(rr >= 0 && cc >= 0 && rr < N && cc < N && !S.grid[rr][cc]) open++;
    rr = r - dr; cc = c - dc;
    while(rr >= 0 && cc >= 0 && rr < N && cc < N && S.grid[rr][cc] === pl){ n++; rr -= dr; cc -= dc; }
    if(rr >= 0 && cc >= 0 && rr < N && cc < N && !S.grid[rr][cc]) open++;

    if(n >= 5) return 1000000;
    if(n === 4 && open === 2) return 120000;
    if(n === 4 && open === 1) return 12000;
    if(n === 3 && open === 2) return 9000;
    if(n === 3 && open === 1) return 900;
    if(n === 2 && open === 2) return 600;
    if(n === 2 && open === 1) return 90;
    if(n === 1 && open === 2) return 24;
    return 6;
  }
  function pointScore(r, c, pl){
    let s = 0;
    for(const [dr, dc] of DIRS) s += runScore(r, c, pl, dr, dc);
    return s;
  }
  function aiMove(){
    let best = null, bestScore = -1;
    for(let r = 0; r < N; r++) for(let c = 0; c < N; c++){
      if(S.grid[r][c]) continue;
      let adj = false;
      for(let dr = -2; dr <= 2 && !adj; dr++) for(let dc = -2; dc <= 2; dc++){
        const rr = r + dr, cc = c + dc;
        if(rr >= 0 && cc >= 0 && rr < N && cc < N && S.grid[rr][cc]){ adj = true; break; }
      }
      if(!adj) continue;
      const atk = pointScore(r, c, 2);
      const def = pointScore(r, c, 1);
      let sc = atk * 1.08 + def;
      if(atk >= 1000000) sc += 5000000;
      if(def >= 1000000) sc += 2000000;
      sc += Math.random() * 12;
      if(sc > bestScore){ bestScore = sc; best = [r, c]; }
    }
    if(!best){
      for(let r = 0; r < N; r++) for(let c = 0; c < N; c++) if(!S.grid[r][c]) return [r, c];
    }
    return best;
  }

  /* ---------------- 落子流程 ---------------- */
  function place(r, c, v){
    addStone(r, c, v);
    S.stack.push([r, c, v]);
    Sound.tone(v === 1 ? 300 : 420, .07, 'triangle', .1);
    haptic(10);
  }

  function afterMove(v){
    if(isFive(S.last[0], S.last[1], v)){
      S.over = true;
      // 连成的那五颗点亮
      const line = winLine(S.last[0], S.last[1], v);
      if(line){
        S.win = line;
        line.forEach(([rr, cc], k) => {
          const s = S.el[rr * N + cc];
          if(!s) return;
          s.style.animationDelay = (k * 55) + 'ms';
          s.classList.add('win');
        });
      }
      rec.plays = (rec.plays || 0) + 1;

      if(S.mode === 'duo'){
        if(v === 1) rec.duo.b = (rec.duo.b || 0) + 1;
        else rec.duo.w = (rec.duo.w || 0) + 1;
        Store.set('save.gomoku', rec);
        paintRec();
        Sound.win();
        plate({
          kicker: '双人对战',
          title: (v === 1 ? '黑方' : '白方') + '五子连珠',
          sub: '共 ' + S.stack.length + ' 手 · 换个人再来一局',
          stars: 3,
          buttons: [
            { label: '再来一局', kind: 'ink', onClick: () => init() },
            { label: '返回目录', onClick: () => Shell.back('../index.html') }
          ]
        });
        return true;
      }

      if(v === 1){
        rec.win = (rec.win || 0) + 1;
        Store.set('save.gomoku', rec);
        paintRec();
        Sound.win();
        plate({
          kicker: 'YOU WIN',
          title: '五子连珠',
          sub: '你执黑获胜 · 共 ' + S.stack.length + ' 手',
          stars: 3,
          buttons: [
            { label: '再来一局', kind: 'ink', onClick: () => init() },
            { label: '返回目录', onClick: () => Shell.back('../index.html') }
          ]
        });
      }else{
        rec.lose = (rec.lose || 0) + 1;
        Store.set('save.gomoku', rec);
        paintRec();
        Sound.lose();
        plate({
          kicker: 'YOU LOSE',
          title: '它连成五子了',
          sub: '再来一局，换个开局试试',
          buttons: [
            { label: '再来一局', kind: 'ink', onClick: () => init() },
            { label: '返回目录', onClick: () => Shell.back('../index.html') }
          ]
        });
      }
      return true;
    }
    if(!hasEmpty()){
      S.over = true;
      Sound.done();
      plate({
        kicker: 'DRAW',
        title: '满盘和棋',
        sub: '棋盘下满了',
        buttons: [{ label: '再来一局', kind: 'ink', onClick: () => init() }]
      });
      return true;
    }
    return false;
  }

  function duoMove(r, c){
    const v = S.turn;
    place(r, c, v);
    if(afterMove(v)) return;
    S.turn = 3 - v;
    updateTurn();
  }

  function aiTurn(r, c){
    S.busy = true;
    place(r, c, 1);
    if(afterMove(1)){ S.busy = false; return; }
    S.turn = 2;
    updateTurn();
    setTimeout(() => {
      const mv = aiMove();
      if(!mv){ S.busy = false; S.turn = 1; updateTurn(); return; }
      place(mv[0], mv[1], 2);
      if(afterMove(2)){ S.busy = false; return; }
      S.turn = 1;
      S.busy = false;
      updateTurn();
    }, 240);
  }

  function tap(r, c){
    if(S.over || S.busy) return;
    if(r < 0 || c < 0 || r >= N || c >= N) return;
    if(S.grid[r][c]) return;
    if(S.mode === 'duo') duoMove(r, c);
    else {
      if(S.turn !== 1) return;
      aiTurn(r, c);
    }
  }

  /* ---------------- 事件 ---------------- */
  board.addEventListener('click', e => {
    const rect = board.getBoundingClientRect();
    const c = Math.round((e.clientX - rect.left) / S.cell - .5);
    const r = Math.round((e.clientY - rect.top) / S.cell - .5);
    tap(r, c);
  });

  /* 桌面端：鼠标停在哪，就在哪显示一枚虚线虚位 */
  board.addEventListener('pointermove', e => {
    const g = S.ghost;
    if(!g) return;
    if(e.pointerType !== 'mouse' || S.over || S.busy){ g.classList.remove('on'); return; }
    const rect = board.getBoundingClientRect();
    const c = Math.round((e.clientX - rect.left) / S.cell - .5);
    const r = Math.round((e.clientY - rect.top) / S.cell - .5);
    if(r < 0 || c < 0 || r >= N || c >= N || S.grid[r][c]){ g.classList.remove('on'); return; }
    g.style.left = ((c + .5) * S.cell) + 'px';
    g.style.top = ((r + .5) * S.cell) + 'px';
    g.classList.add('on');
  });
  board.addEventListener('pointerleave', () => { if(S.ghost) S.ghost.classList.remove('on'); });

  document.getElementById('btnUndo').addEventListener('click', () => {
    if(S.busy || !S.stack.length) return;
    if(S.over && !S.stack.length) return;

    if(S.mode === 'duo'){
      const [r, c] = S.stack.pop();
      S.grid[r][c] = 0;
      S.turn = 3 - S.turn;              // 回到上一位的回合
    }else{
      // 退到自己（黑）落子之前，最多回退两手
      let guard = 4;
      while(S.stack.length && guard--){
        const [r, c, v] = S.stack.pop();
        S.grid[r][c] = 0;
        if(v === 1) break;
      }
      S.turn = 1;
    }

    S.over = false;
    const top = S.stack[S.stack.length - 1];
    S.last = top ? [top[0], top[1]] : null;
    paintStones();
    paintRec();
    updateTurn();
  });

  segMode.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    const m = b.dataset.m;
    if(m === S.mode) return;
    S.mode = m;
    rec.mode = m;
    Store.set('save.gomoku', rec);
    Sound.pick ? Sound.pick(2) : Sound.tone(420, .05, 'sine', .06);
    init();
    toast(m === 'duo' ? '双人对战：黑先，轮流落子' : '人机对战：你先手执黑');
  });

  document.getElementById('btnRestart').addEventListener('click', init);
  document.getElementById('btnBack').addEventListener('click', () => Shell.back('../index.html'));

  function paintSound(){
    btnSound.innerHTML = Sound.on
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3l5 4V5L7 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3l5 4V5L7 9H4Z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>';
  }
  paintSound();
  btnSound.addEventListener('click', () => { Sound.toggle(); paintSound(); });

  window.addEventListener('resize', () => { layout(); });
  init();
})();
</script>
</body>
</html>
