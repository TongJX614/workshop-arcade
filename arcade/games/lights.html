<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F2EEE4">
<title>熄灯 · 工坊游戏集</title>
<link rel="stylesheet" href="../assets/shell.css">
<style>
  .stage{padding:0 0 44px;}
  /* 灯箱：一块镶了内框的配电盘 */
  .grid{
    display:grid;gap:2px;width:min(100%,420px);
    padding:6px;
    background:rgba(31,28,22,.15);
    border:1px solid var(--line-2);
    border-radius:1px;
    box-shadow:
      var(--sh-deep),
      inset 0 0 0 1px rgba(255,255,255,.45),
      inset 0 0 22px rgba(31,28,22,.10);
  }
  .lamp{
    appearance:none;border:0;aspect-ratio:1/1;cursor:pointer;position:relative;
    background:linear-gradient(180deg,#F7F2E6 0%,#ECE3D1 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(31,28,22,.07);
    transition:background .22s ease,box-shadow .22s ease,transform .1s;
    -webkit-tap-highlight-color:transparent;
  }
  .lamp:active{transform:scale(.99)}
  /* 灯泡：玻璃罩 */
  .lamp::after{
    content:"";position:absolute;left:50%;top:50%;width:56%;height:56%;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#F8F3E7 0%,#D8CEB7 70%,#C6BBA1 100%);
    border:1px solid rgba(31,28,22,.22);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.9),
      inset 0 -2px 3px rgba(31,28,22,.16),
      0 1px 2px rgba(31,28,22,.20);
    transition:background .22s ease,border-color .22s ease,box-shadow .24s ease,transform .22s var(--ease);
    z-index:1;
  }
  /* 点亮的反光点 */
  .lamp::before{
    content:"";position:absolute;left:32%;top:30%;width:12%;height:9%;
    border-radius:50%;background:rgba(255,255,255,.85);
    opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:2;
  }
  .lamp.on{background:linear-gradient(180deg,#FFF8EF 0%,#F9EADD 100%)}
  .lamp.on::after{
    background:radial-gradient(circle at 34% 28%,#EF8064 0%,#B4402C 52%,#8A2F1E 100%);
    border-color:#7E2A19;
    box-shadow:
      0 0 0 1px rgba(180,64,44,.22),
      0 0 13px rgba(180,64,44,.42),
      0 0 26px rgba(180,64,44,.16),
      inset 0 -2px 4px rgba(80,20,10,.32),
      inset 0 2px 2px rgba(255,255,255,.30);
    transform:translate(-50%,-50%) scale(1.02);
  }
  .lamp.on::before{opacity:.8}
  .lamp:active::after{transform:translate(-50%,-50%) scale(.9)}
  .lamp.hint::after{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(47,106,181,.16),0 0 10px rgba(47,106,181,.25)}
  .plinth b{color:var(--accent)}
  @keyframes lampIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="bar__back" id="btnBack" aria-label="返回目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg>
    </button>
    <div class="bar__text">
      <div class="kicker">X · Lights Out</div>
      <h1>熄灯</h1>
    </div>
    <div class="bar__meta">步数 <b id="uiMoves">0</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="grid" id="grid"></div>
    <div class="plinth">
      <span>剩 <b id="uiLeft">0</b> 盏 · <span id="uiSize">5 × 5</span></span>
      <span class="r" id="uiBest">最少 —</span>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="segSize">
      <button data-n="4">4 × 4</button>
      <button data-n="5">5 × 5</button>
      <button data-n="6">6 × 6</button>
    </div>
    <span class="sep"></span>
    <button class="btn" id="btnNew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      新局
    </button>
    <button class="btn btn--sq" id="btnSound" title="声音"></button>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function(){
  'use strict';
  const { Store, Sound, plate, fmtNum, haptic } = Shell;

  const gridEl = document.getElementById('grid');
  const stage = document.getElementById('stage');
  const uiMoves = document.getElementById('uiMoves');
  const uiLeft = document.getElementById('uiLeft');
  const uiSize = document.getElementById('uiSize');
  const uiBest = document.getElementById('uiBest');
  const segSize = document.getElementById('segSize');
  const btnSound = document.getElementById('btnSound');

  const S = { n: 5, on: [], moves: 0, done: false, els: [] };

  function save(){ return Store.get('save.lights', {}) || {}; }

  function build(){
    gridEl.style.gridTemplateColumns = 'repeat(' + S.n + ', 1fr)';
    gridEl.innerHTML = '';
    S.els = [];
    for(let r = 0; r < S.n; r++){
      for(let c = 0; c < S.n; c++){
        const b = document.createElement('button');
        b.className = 'lamp';
        b.dataset.r = r; b.dataset.c = c;
        b.addEventListener('click', () => tap(r, c));
        // 灯一盏盏亮起
        b.style.animation = 'lampIn .34s cubic-bezier(.22,1,.36,1) backwards';
        b.style.animationDelay = ((r + c) * 20) + 'ms';
        gridEl.appendChild(b);
        S.els.push(b);
      }
    }
  }

  function paint(){
    let left = 0;
    for(let r = 0; r < S.n; r++) for(let c = 0; c < S.n; c++){
      const v = S.on[r][c];
      if(v) left++;
      S.els[r * S.n + c].classList.toggle('on', !!v);
    }
    uiLeft.textContent = left;
    uiMoves.textContent = S.moves;
    return left;
  }

  function toggle(r, c){
    if(r < 0 || c < 0 || r >= S.n || c >= S.n) return;
    S.on[r][c] = !S.on[r][c];
  }

  function tap(r, c){
    if(S.done) return;
    S.moves++;
    toggle(r, c); toggle(r - 1, c); toggle(r + 1, c); toggle(r, c - 1); toggle(r, c + 1);
    Sound.tone(360 + (r + c) * 18, .06, 'triangle', .07);
    haptic(7);
    Shell.bump(uiMoves);
    const left = paint();
    if(left === 0) win();
  }

  /* 从全灭开始随机按 K 次，必然可解 */
  function newGame(){
    S.n = S.n;
    S.on = [];
    for(let r = 0; r < S.n; r++) S.on.push(new Array(S.n).fill(false));
    S.moves = 0;
    S.done = false;
    // 用奇偶集合避免同一格按两次相互抵消
    const presses = new Set();
    const count = Math.max(4, Math.round(S.n * S.n * 0.6));
    while(presses.size < count){
      presses.add((Math.random() * S.n * S.n) | 0);
    }
    presses.forEach(idx => {
      const r = (idx / S.n) | 0, c = idx % S.n;
      toggle(r, c); toggle(r - 1, c); toggle(r + 1, c); toggle(r, c - 1); toggle(r, c + 1);
    });
    // 万一全灭（极少数），重来
    if(S.on.every(row => row.every(v => !v))) return newGame();

    build();
    paint();
    uiSize.textContent = S.n + ' × ' + S.n;
    const b = save();
    const best = (b.best && typeof b.best === 'object') ? b.best[S.n] : (b.size === S.n ? b.best : null);
    uiBest.textContent = '最少 ' + (best || '—') + ' 步';
  }

  function win(){
    S.done = true;
    Sound.win();
    haptic([10, 30, 12]);
    Shell.flash(gridEl, 420);
    const b = save();
    b.best = (b.best && typeof b.best === 'object') ? b.best : {};
    const prev = b.best[S.n];
    b.best[S.n] = prev ? Math.min(prev, S.moves) : S.moves;
    b.size = S.n;
    b.flatBest = b.best[S.n];
    b.plays = (b.plays || 0) + 1;
    Store.set('save.lights', b);
    uiBest.textContent = '最少 ' + b.flatBest + ' 步';
    const stars = S.moves <= S.n * S.n * 0.55 ? 3 : S.moves <= S.n * S.n * 1.1 ? 2 : 1;
    plate({
      kicker: 'ALL DARK',
      title: prev && S.moves < prev ? '刷新最少' : '全部熄灭',
      sub: S.n + ' × ' + S.n + ' · ' + S.moves + ' 步' + (prev ? ' · 之前 ' + prev + ' 步' : ''),
      stars: stars,
      buttons: [
        { label: '再来一局', kind: 'ink', onClick: () => newGame() },
        { label: '返回目录', onClick: () => Shell.back('../index.html') }
      ]
    });
  }

  /* ---------------- 事件 ---------------- */
  Array.prototype.forEach.call(segSize.children, b => {
    b.addEventListener('click', () => {
      S.n = +b.dataset.n;
      Array.prototype.forEach.call(segSize.children, x => x.setAttribute('aria-pressed', String(x === b)));
      newGame();
    });
  });
  document.getElementById('btnNew').addEventListener('click', newGame);
  document.getElementById('btnBack').addEventListener('click', () => Shell.back('../index.html'));

  function paintSound(){
    btnSound.innerHTML = Sound.on
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3l5 4V5L7 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3l5 4V5L7 9H4Z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>';
  }
  paintSound();
  btnSound.addEventListener('click', () => { Sound.toggle(); paintSound(); });

  const s0 = save();
  S.n = s0.size || 5;
  Array.prototype.forEach.call(segSize.children, b => {
    b.setAttribute('aria-pressed', String(+b.dataset.n === S.n));
  });
  newGame();
})();
</script>
</body>
</html>
