<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F2EEE4">
<title>反应力 · 工坊游戏集</title>
<link rel="stylesheet" href="../assets/shell.css">
<style>
  .stage{padding:0 0 36px;gap:14px}
  .pad{
    position:relative;width:min(100%,420px);aspect-ratio:1/1;
    border:1px solid var(--line-2);cursor:pointer;
    background:#FBF8F1;
    box-shadow:var(--sh-deep),inset 0 0 50px rgba(31,28,22,.05);
    display:grid;place-items:center;text-align:center;
    transition:background .1s ease,box-shadow .2s;
    overflow:hidden;user-select:none;
  }
  .pad.wait{
    background:
      repeating-linear-gradient(45deg,rgba(31,28,22,.035) 0 2px,transparent 2px 12px),
      #F5EFE1;
  }
  .pad.go{
    background:#B4402C;
    box-shadow:0 0 0 1px #8A2F1E,0 30px 60px -40px rgba(180,64,44,1),inset 0 0 60px rgba(0,0,0,.14);
  }
  .pad.go .big{color:#FFF6F1}
  .pad.go .sub{color:rgba(255,246,241,.72)}
  .pad.fail{background:#2A241C}
  .pad.fail .big{color:#F0E6D6}
  .pad.fail .sub{color:rgba(240,230,214,.6)}
  .big{
    font-family:var(--serif);font-size:clamp(30px,9vw,44px);letter-spacing:.14em;
    color:var(--ink);position:relative;z-index:1;
    transition:color .12s;
  }
  .sub{
    font-family:var(--serif);font-size:10.5px;letter-spacing:.2em;
    color:var(--ink-3);margin-top:10px;position:relative;z-index:1;
    transition:color .12s;
  }
  .pad .big{animation:bigIn .24s var(--ease)}
  @keyframes bigIn{from{opacity:.4;transform:scale(.94)}to{opacity:1;transform:none}}
  /* 等的时候，一圈缓慢转动的刻度 */
  .pad.wait::after{
    content:"";position:absolute;width:62%;aspect-ratio:1/1;border-radius:50%;
    border:1px dashed rgba(31,28,22,.14);
    animation:spin 8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .rounds{
    display:flex;gap:6px;justify-content:center;align-items:center;
    font-family:var(--serif);font-size:10px;letter-spacing:.16em;color:var(--ink-3);
    min-height:18px;
  }
  .rounds i{width:18px;height:3px;background:var(--line-2);display:block;transition:background .2s}
  .rounds i.ok{background:var(--accent)}
  .rounds i.bad{background:#8B8271}
  .plinth b{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="bar__back" id="btnBack" aria-label="返回目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg>
    </button>
    <div class="bar__text">
      <div class="kicker">XXXII · Reaction</div>
      <h1>反应力</h1>
    </div>
    <div class="bar__meta">第 <b id="uiRound">0</b> / 5</div>
  </div>

  <div class="stage" id="stage">
    <div class="pad" id="pad">
      <div>
        <div class="big" id="big">点一下开始</div>
        <div class="sub" id="sub">等纸面变朱红再点，太快算抢跑</div>
      </div>
    </div>
    <div class="rounds" id="rounds"></div>
    <div class="plinth">
      <span>最快 <b id="uiFast">—</b> · 平均 <b id="uiAvg">—</b></span>
      <span class="r" id="uiBest">最佳 —</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnRestart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      重来
    </button>
    <button class="btn btn--sq" id="btnSound" title="声音"></button>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function(){
  'use strict';
  const { Store, Sound, plate, haptic } = Shell;

  const pad = document.getElementById('pad');
  const big = document.getElementById('big');
  const sub = document.getElementById('sub');
  const roundsEl = document.getElementById('rounds');
  const uiRound = document.getElementById('uiRound');
  const uiFast = document.getElementById('uiFast');
  const uiAvg = document.getElementById('uiAvg');
  const uiBest = document.getElementById('uiBest');

  const TOTAL = 5;
  const S = { state: 'idle', times: [], round: 0, t0: 0, timer: 0, done: false };

  function save(){ return Store.get('save.reaction', {}) || {}; }

  function paintRounds(){
    roundsEl.innerHTML = '';
    for(let i = 0; i < TOTAL; i++){
      const d = document.createElement('i');
      if(S.times[i] != null) d.className = S.times[i] > 0 ? 'ok' : 'bad';
      roundsEl.appendChild(d);
    }
    // 平均 / 最快
    const valid = S.times.filter(t => t > 0);
    if(valid.length){
      uiFast.textContent = Math.min.apply(null, valid) + ' ms';
      const avg = Math.round(valid.reduce((a, b) => a + b, 0) / valid.length);
      uiAvg.textContent = avg + ' ms';
    }else{
      uiFast.textContent = '—';
      uiAvg.textContent = '—';
    }
    uiRound.textContent = Math.min(TOTAL, S.round);
  }

  function setState(st, title, note){
    S.state = st;
    pad.className = 'pad' + (st === 'wait' ? ' wait' : st === 'go' ? ' go' : st === 'fail' ? ' fail' : '');
    big.textContent = title;
    sub.textContent = note || '';
    big.style.animation = 'none';
    void big.offsetWidth;
    big.style.animation = '';
  }

  function nextRound(){
    if(S.round >= TOTAL){ finish(); return; }
    setState('wait', '等着…', '别急，等它变红');
    const delay = 900 + Math.random() * 1900;
    S.t0 = 0;
    S.timer = setTimeout(() => {
      S.t0 = performance.now();
      setState('go', '点！', '');
      Sound.tone(880, .08, 'sine', .12);
      haptic(10);
    }, delay);
  }

  function tap(){
    if(S.done){
      S.times = []; S.round = 0; S.done = false;
      paintRounds();
      nextRound();
      return;
    }
    if(S.state === 'go'){
      const ms = Math.round(performance.now() - S.t0);
      S.times.push(ms);
      S.round++;
      Sound.done();
      haptic(7);
      if(ms < 220) Shell.floatNum(pad, ms + ' ms', '');
      paintRounds();
      if(S.round >= TOTAL){
        setState('idle', ms + ' ms', '算一下…');
        S.state = 'after';
        setTimeout(finish, 460);
        return;
      }
      setState('idle', ms + ' ms', '点一下进入下一轮');
      S.state = 'after';
      return;
    }
    if(S.state === 'wait'){
      clearTimeout(S.timer);
      S.times.push(-1);
      S.round++;
      setState('fail', '抢跑了', '这一轮不算，点一下继续');
      Sound.bad();
      haptic([12, 40]);
      paintRounds();
      S.state = 'after';
      return;
    }
    // idle / after：进入下一轮
    if(S.round >= TOTAL){ finish(); return; }
    nextRound();
  }

  function finish(){
    S.done = true;
    clearTimeout(S.timer);
    const valid = S.times.filter(t => t > 0);
    const avg = valid.length ? Math.round(valid.reduce((a, b) => a + b, 0) / valid.length) : 9999;
    const fast = valid.length ? Math.min.apply(null, valid) : 9999;
    const sv = save();
    const good = avg < (sv.best || 99999);
    if(good) sv.best = avg;
    sv.plays = (sv.plays || 0) + 1;
    sv.fast = Math.min(sv.fast || 99999, fast);
    Store.set('save.reaction', sv);
    uiBest.textContent = '最佳 ' + (sv.best || avg) + ' ms';
    setState('idle', avg + ' ms', '平均反应时间');
    Sound.win();
    haptic([10, 30, 12]);
    const title = avg < 220 ? '快得离谱' : avg < 290 ? '手很快' : avg < 380 ? '正常水准' : avg < 520 ? '有点慢' : '再来一次吧';
    setTimeout(() => {
      plate({
        kicker: 'AVERAGE',
        title: title,
        sub: '平均 ' + avg + ' ms · 最快 ' + fast + ' ms' + (S.times.some(t => t < 0) ? ' · 有抢跑' : ''),
        stars: avg < 240 ? 3 : avg < 320 ? 2 : avg < 420 ? 1 : 0,
        buttons: [
          { label: '再来一组', kind: 'ink', onClick: () => { S.times = []; S.round = 0; S.done = false; paintRounds(); nextRound(); } },
          { label: '返回目录', onClick: () => Shell.back('../index.html') }
        ]
      });
    }, 520);
  }

  pad.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  document.addEventListener('keydown', e => {
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); tap(); }
  });
  document.getElementById('btnRestart').addEventListener('click', () => {
    clearTimeout(S.timer);
    S.times = []; S.round = 0; S.done = false;
    paintRounds();
    nextRound();
  });
  document.getElementById('btnBack').addEventListener('click', () => Shell.back('../index.html'));
  Shell.soundBtn(document.getElementById('btnSound'));

  paintRounds();
  const sv0 = save();
  uiBest.textContent = sv0.best ? '最佳 ' + sv0.best + ' ms' : '—';
})();
</script>
</body>
</html>
