<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F2EEE4">
<title>二十四点 · 工坊游戏集</title>
<link rel="stylesheet" href="../assets/shell.css">
<style>
  .stage{padding:0 0 40px;gap:clamp(14px,3vh,26px)}
  .cards{
    display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2.2vw,12px);
    min-height:132px;flex-wrap:wrap;
  }
  .pcard{
    appearance:none;cursor:pointer;position:relative;
    width:clamp(58px,17vw,76px);height:clamp(84px,24vw,108px);
    background:linear-gradient(180deg,#FFFDF7,#F6F0E1);
    border:1px solid var(--line-2);border-radius:3px;
    box-shadow:var(--sh-lift),inset 0 0 0 3px rgba(255,255,255,.7);
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;
    padding:6px 7px;
    transition:transform .18s var(--ease),box-shadow .2s,border-color .16s;
    -webkit-tap-highlight-color:transparent;
    font-family:var(--serif);
  }
  .pcard:hover{transform:translateY(-4px)}
  .pcard.sel{
    transform:translateY(-10px);
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent),0 14px 20px -16px rgba(31,28,22,.9);
  }
  .pcard .rank{font-size:clamp(19px,5.6vw,25px);line-height:1;font-variant-numeric:tabular-nums}
  .pcard .suit{font-size:clamp(14px,4vw,18px);line-height:1}
  .pcard .suit.red{color:var(--accent)}
  .pcard.result{padding-bottom:16px}
  .pcard .expr{
    position:absolute;left:4px;right:4px;bottom:3px;text-align:center;
    font-family:var(--serif);font-size:7.5px;letter-spacing:.02em;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pcard.result .rank{color:var(--accent-2);font-size:clamp(17px,5vw,22px)}
  .pcard.new{animation:deal .3s var(--ease) backwards}
  @keyframes deal{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}
  .ops{display:flex;gap:clamp(6px,2.4vw,12px)}
  .op{
    appearance:none;width:clamp(48px,13.4vw,58px);height:clamp(48px,13.4vw,58px);
    border:1px solid var(--line-2);background:var(--paper-hi);cursor:pointer;
    font-family:var(--serif);font-size:22px;color:var(--ink);border-radius:2px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
    transition:background .14s,transform .1s,opacity .2s;
    display:grid;place-items:center;
  }
  .op:hover:not([disabled]){background:rgba(31,28,22,.05)}
  .op:active:not([disabled]){transform:translateY(1px);box-shadow:var(--sh-press)}
  .op[disabled]{opacity:.3;cursor:default}
  .op.ready{border-color:var(--ink);background:var(--ink);color:var(--paper-hi)}
  .target{
    display:flex;align-items:baseline;gap:8px;font-family:var(--serif);
    font-size:10px;letter-spacing:.2em;color:var(--ink-3);
  }
  .target b{font-size:26px;color:var(--accent);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .hint{font-family:var(--serif);font-size:11px;letter-spacing:.1em;color:var(--ink-2);min-height:14px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="bar__back" id="btnBack" aria-label="返回目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg>
    </button>
    <div class="bar__text">
      <div class="kicker">XVIII · Twenty-Four</div>
      <h1>二十四点</h1>
    </div>
    <div class="bar__meta">步 <b id="uiStep">0</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="target"><span>凑到</span><b>24</b><span>为止</span></div>
    <div class="cards" id="cards"></div>
    <div class="ops" id="ops">
      <button class="op" data-op="+">+</button>
      <button class="op" data-op="-">−</button>
      <button class="op" data-op="*">×</button>
      <button class="op" data-op="/">÷</button>
    </div>
    <div class="hint" id="uiHint">先点两张牌，再点一个运算</div>
    <div class="plinth">
      <span>剩余 <b id="uiLeft">4</b> 张</span>
      <span class="r" id="uiBest">—</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12H8"/></svg>
      撤销
    </button>
    <button class="btn" id="btnNew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      换一题
    </button>
    <button class="btn btn--sq" id="btnSound" title="声音"></button>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function(){
  'use strict';
  const { Store, Sound, plate, haptic } = Shell;

  const cardsEl = document.getElementById('cards');
  const opsEl = document.getElementById('ops');
  const uiHint = document.getElementById('uiHint');
  const uiStep = document.getElementById('uiStep');
  const uiLeft = document.getElementById('uiLeft');
  const uiBest = document.getElementById('uiBest');

  const SUITS = ['♠', '♥', '♦', '♣'];
  const S = { cards: [], sel: [], hist: [], steps: 0, done: false, busy: false };

  function save(){ return Store.get('save.tf', {}) || {}; }

  /* ---------- 有解判定 ---------- */
  function solvable(nums){
    if(nums.length === 1) return Math.abs(nums[0] - 24) < 1e-6;
    for(let i = 0; i < nums.length; i++){
      for(let j = 0; j < nums.length; j++){
        if(i === j) continue;
        const rest = [];
        for(let k = 0; k < nums.length; k++) if(k !== i && k !== j) rest.push(nums[k]);
        const a = nums[i], b = nums[j];
        const vals = [a + b, a * b, a - b, b - a];
        if(Math.abs(b) > 1e-9) vals.push(a / b);
        if(Math.abs(a) > 1e-9) vals.push(b / a);
        for(const v of vals){
          if(solvable(rest.concat([v]))) return true;
        }
      }
    }
    return false;
  }

  function genCards(){
    for(let t = 0; t < 800; t++){
      const nums = [0,1,2,3].map(() => 1 + Shell.rand(13));
      if(solvable(nums.slice())){
        return nums.map((v, i) => ({
          v, expr: String(v),
          suit: SUITS[i],
          red: i === 1 || i === 2,
          base: true
        }));
      }
    }
    return [4, 6, 2, 3].map((v, i) => ({ v, expr: String(v), suit: SUITS[i], red: i === 1 || i === 2, base: true }));
  }

  function fmt(v){
    if(Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
    return (Math.round(v * 100) / 100).toFixed(2).replace(/0+$/, '');
  }

  function paint(){
    cardsEl.innerHTML = '';
    S.cards.forEach((card, i) => {
      const b = document.createElement('button');
      b.className = 'pcard' + (card.base ? '' : ' result') + (S.sel.indexOf(i) >= 0 ? ' sel' : '');
      if(card.fresh) b.classList.add('new');
      const rank = card.base ? ({1:'A',11:'J',12:'Q',13:'K'}[card.v] || String(card.v)) : fmt(card.v);
      b.innerHTML =
        '<div class="rank">' + rank + '</div>' +
        '<div class="suit' + (card.red ? ' red' : '') + '">' + card.suit + '</div>' +
        (card.base ? '' : '<div class="expr">' + card.expr + '</div>');
      b.addEventListener('click', () => pick(i));
      cardsEl.appendChild(b);
      card.fresh = false;
    });
    const ready = S.sel.length === 2;
    Array.prototype.forEach.call(opsEl.children, o => {
      o.disabled = !ready;
      o.classList.toggle('ready', ready);
    });
    uiLeft.textContent = S.cards.length;
    uiStep.textContent = S.steps;
    const sv = save();
    uiBest.textContent = sv.best ? '最少 ' + sv.best + ' 步' : '—';
  }

  function pick(i){
    if(S.done || S.busy) return;
    const at = S.sel.indexOf(i);
    if(at >= 0){ S.sel.splice(at, 1); }
    else{
      if(S.sel.length >= 2) S.sel.shift();
      S.sel.push(i);
    }
    Sound.tone(480 + i * 40, .04, 'sine', .05);
    haptic(5);
    uiHint.textContent = S.sel.length === 2
      ? '选一个运算，把这两张合成一张'
      : S.sel.length === 1 ? '再点一张牌' : '先点两张牌，再点一个运算';
    paint();
  }

  function compute(op){
    if(S.sel.length !== 2) return;
    const i = S.sel[0], j = S.sel[1];
    const a = S.cards[i], b = S.cards[j];
    let v;
    if(op === '+') v = a.v + b.v;
    else if(op === '-') v = a.v - b.v;
    else if(op === '*') v = a.v * b.v;
    else{
      if(Math.abs(b.v) < 1e-9){ Sound.bad(); Shell.toast('不能除以零'); return; }
      v = a.v / b.v;
    }
    S.hist.push(JSON.parse(JSON.stringify(S.cards)));
    const expr = '(' + a.expr + ' ' + (op === '*' ? '×' : op === '/' ? '÷' : op) + ' ' + b.expr + ')';
    const next = S.cards.filter((_, k) => k !== i && k !== j);
    next.push({ v, expr, suit: a.suit, red: a.red, base: false, fresh: true });
    S.cards = next;
    S.sel = [];
    S.steps++;
    Sound.drop(S.cards.length);
    haptic(9);
    uiHint.textContent = '= ' + fmt(v);
    paint();
    if(S.cards.length === 1){
      if(Math.abs(S.cards[0].v - 24) < 1e-6) win();
      else{
        S.busy = false;
        uiHint.textContent = '结果是 ' + fmt(S.cards[0].v) + '，不是 24 — 撤销一步再试';
        Sound.bad();
      }
    }
  }

  function win(){
    S.done = true;
    Sound.win();
    haptic([10, 30, 12]);
    Shell.flash(cardsEl, 420);
    const sv = save();
    const good = !sv.best || S.steps < sv.best;
    if(good) sv.best = S.steps;
    sv.plays = (sv.plays || 0) + 1;
    sv.wins = (sv.wins || 0) + 1;
    Store.set('save.tf', sv);
    setTimeout(() => {
      plate({
        kicker: 'TWENTY-FOUR',
        title: '凑成二十四',
        sub: S.cards[0].expr.replace(/[()]/g, '') + ' = 24 · ' + S.steps + ' 步',
        stars: S.steps <= 3 ? 3 : S.steps <= 4 ? 2 : 1,
        buttons: [
          { label: '再来一题', kind: 'ink', onClick: newGame },
          { label: '返回目录', onClick: () => Shell.back('../index.html') }
        ]
      });
    }, 460);
  }

  function undo(){
    if(!S.hist.length || S.done) { Sound.bad(); return; }
    S.cards = S.hist.pop();
    S.sel = [];
    S.steps = Math.max(0, S.steps - 1);
    Sound.tone(320, .06, 'triangle', .07);
    uiHint.textContent = '退回上一步';
    paint();
  }

  function newGame(){
    S.cards = genCards();
    S.sel = []; S.hist = []; S.steps = 0; S.done = false; S.busy = false;
    uiHint.textContent = '先点两张牌，再点一个运算';
    paint();
  }

  Array.prototype.forEach.call(opsEl.children, o => {
    o.addEventListener('click', () => compute(o.dataset.op));
  });
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnNew').addEventListener('click', newGame);
  document.getElementById('btnBack').addEventListener('click', () => Shell.back('../index.html'));
  Shell.soundBtn(document.getElementById('btnSound'));

  document.addEventListener('keydown', e => {
    if(e.key === '+' || e.key === '=') compute('+');
    if(e.key === '-') compute('-');
    if(e.key === '*' || e.key === 'x') compute('*');
    if(e.key === '/') compute('/');
    if(e.key === 'z' && (e.ctrlKey || e.metaKey)) undo();
  });

  newGame();
})();
</script>
</body>
</html>
